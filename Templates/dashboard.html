<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --border: #e5e7eb;
            --text: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .time {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Main Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-positive {
            color: var(--success);
        }

        .card-negative {
            color: var(--danger);
        }

        /* Market Sections */
        .market-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .market-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .market-controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .stat-box.success {
            border-left-color: var(--success);
        }

        .stat-box.danger {
            border-left-color: var(--danger);
        }

        .stat-box.warning {
            border-left-color: var(--warning);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        /* Trade Table */
        .trade-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .trade-table thead {
            background: var(--light);
        }

        .trade-table th {
            padding: 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trade-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .trade-table tr:hover {
            background: rgba(59, 130, 246, 0.05);
        }

        .trade-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .trade-badge.buy {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .trade-badge.sell {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Widgets */
        .widgets-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .widgets-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .widget-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .widget-btn {
            padding: 8px 12px;
            font-size: 11px;
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .widget-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .widget-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .widget {
            background: var(--light);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .widget-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .widget-content {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Chart Container */
        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
            margin-top: 20px;
        }

        /* Alerts */
        .alerts-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        .alert-item {
            padding: 12px;
            border-left: 4px solid var(--primary);
            background: var(--light);
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-item.success {
            border-left-color: var(--success);
        }

        .alert-item.danger {
            border-left-color: var(--danger);
        }

        .alert-item.warning {
            border-left-color: var(--warning);
        }

        .alert-content {
            flex: 1;
        }

        .alert-message {
            font-size: 13px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .alert-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .alert-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            padding: 0 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .widgets-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Animation */
        .loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div>
                <h1>📊 Trading Bot Dashboard</h1>
            </div>
            <div class="header-right">
                <div class="time" id="currentTime"></div>
                <div id="statusIndicator" class="status-badge disconnected">Offline</div>
            </div>
        </header>

        <!-- Summary Cards -->
        <div class="dashboard-grid" id="summaryCards">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Forex Section -->
        <div class="market-section">
            <div class="market-header">
                <div class="market-title">💱 Forex Trading</div>
                <div class="market-controls">
                    <button class="btn-primary" onclick="startForexBot()">▶ Start</button>
                    <button class="btn-danger" onclick="stopForexBot()">⏹ Stop</button>
                </div>
            </div>

            <div class="stats-grid" id="forexStats">
                <!-- Will be populated by JavaScript -->
            </div>

            <div style="overflow-x: auto;">
                <table class="trade-table" id="forexTrades">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Symbol</th>
                            <th>Type</th>
                            <th>Entry</th>
                            <th>Exit</th>
                            <th>P&L</th>
                        </tr>
                    </thead>
                    <tbody id="forexTradesBody">
                        <tr><td colspan="6" style="text-align: center; color: #999;">No trades yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Crypto Section -->
        <div class="market-section">
            <div class="market-header">
                <div class="market-title">₿ Crypto Trading</div>
                <div class="market-controls">
                    <button class="btn-primary" onclick="startCryptoBot()">▶ Start</button>
                    <button class="btn-danger" onclick="stopCryptoBot()">⏹ Stop</button>
                </div>
            </div>

            <div class="stats-grid" id="cryptoStats">
                <!-- Will be populated by JavaScript -->
            </div>

            <div style="overflow-x: auto;">
                <table class="trade-table" id="cryptoTrades">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Symbol</th>
                            <th>Type</th>
                            <th>Entry</th>
                            <th>Exit</th>
                            <th>P&L</th>
                        </tr>
                    </thead>
                    <tbody id="cryptoTradesBody">
                        <tr><td colspan="6" style="text-align: center; color: #999;">No trades yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Widgets Section -->
        <div class="widgets-section">
            <div class="widgets-header">
                <h2>📈 Technical Indicators</h2>
                <div class="widget-controls">
                    <button class="widget-btn active" onclick="toggleWidget('price_chart')">📊 Price Chart</button>
                    <button class="widget-btn active" onclick="toggleWidget('rsi_indicator')">📈 RSI</button>
                    <button class="widget-btn active" onclick="toggleWidget('macd')">⚙️ MACD</button>
                    <button class="widget-btn active" onclick="toggleWidget('news_feed')">📰 News</button>
                    <button class="widget-btn active" onclick="toggleWidget('heatmap')">🔥 Heatmap</button>
                </div>
            </div>

            <div class="widgets-grid" id="widgetsContainer">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Alerts Section -->
        <div class="alerts-section">
            <h2 style="margin-bottom: 15px;">🔔 Recent Alerts</h2>
            <div id="alertsContainer">
                <p style="color: #999; text-align: center;">No alerts yet</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let updateInterval;

        // Initialize Dashboard
        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            updateInterval = setInterval(updateDashboard, 3000); // Update every 3 seconds
            updateTime();
            setInterval(updateTime, 1000);
        });

        // Update Time
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString();
        }

        // Main Dashboard Update
        async function updateDashboard() {
            try {
                const response = await fetch(`${API_BASE}/dashboard/summary`);
                const data = await response.json();

                // Update summary cards
                updateSummaryCards(data);

                // Update Forex section
                updateForexSection(data.forex);

                // Update Crypto section
                updateCryptoSection(data.crypto);

                // Update status
                const forexStatus = data.forex.status === 'running' ? 'connected' : 'disconnected';
                const cryptoStatus = data.crypto.status === 'running' ? 'connected' : 'disconnected';
                const overallStatus = (forexStatus === 'connected' || cryptoStatus === 'connected') ? 'connected' : 'disconnected';
                
                document.getElementById('statusIndicator').className = `status-badge ${overallStatus}`;
                document.getElementById('statusIndicator').textContent = overallStatus === 'connected' ? '🟢 Online' : '🔴 Offline';

                // Fetch and update alerts
                updateAlerts();
            } catch (error) {
                console.error('Error updating dashboard:', error);
            }
        }

        // Update Summary Cards
        function updateSummaryCards(data) {
            const container = document.getElementById('summaryCards');
            
            const cards = [
                {
                    title: 'Forex Balance',
                    value: `$${data.forex.balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`,
                    subtitle: `P&L: ${data.forex.profit_loss_percent > 0 ? '+' : ''}${data.forex.profit_loss_percent.toFixed(2)}%`,
                    positive: data.forex.profit_loss_percent > 0
                },
                {
                    title: 'Crypto Balance',
                    value: `$${data.crypto.balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`,
                    subtitle: `P&L: ${data.crypto.profit_loss_percent > 0 ? '+' : ''}${data.crypto.profit_loss_percent.toFixed(2)}%`,
                    positive: data.crypto.profit_loss_percent > 0
                },
                {
                    title: 'Total Equity',
                    value: `$${(data.forex.equity + data.crypto.equity).toLocaleString('en-US', {minimumFractionDigits: 2})}`,
                    subtitle: 'Combined account value',
                    positive: true
                },
                {
                    title: 'Active Trades',
                    value: `${data.forex.active_trades + data.crypto.active_trades}`,
                    subtitle: `Forex: ${data.forex.active_trades} | Crypto: ${data.crypto.active_trades}`,
                    positive: true
                }
            ];

            container.innerHTML = cards.map(card => `
                <div class="card">
                    <div class="card-title">${card.title}</div>
                    <div class="card-value ${card.positive ? 'card-positive' : 'card-negative'}">${card.value}</div>
                    <div class="card-subtitle">${card.subtitle}</div>
                </div>
            `).join('');
        }

        // Update Forex Section
        function updateForexSection(forexData) {
            // Update stats
            const forexStats = document.getElementById('forexStats');
            forexStats.innerHTML = `
                <div class="stat-box success">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value">${forexData.win_rate.toFixed(1)}%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Trades</div>
                    <div class="stat-value">${forexData.total_trades}</div>
                </div>
                <div class="stat-box ${forexData.profit_loss > 0 ? 'success' : 'danger'}">
                    <div class="stat-label">P&L</div>
                    <div class="stat-value">${forexData.profit_loss > 0 ? '+' : ''}$${forexData.profit_loss.toFixed(2)}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Status</div>
                    <div class="stat-value">${forexData.status === 'running' ? '🟢 Running' : '🔴 Stopped'}</div>
                </div>
            `;

            // Update trades table
            updateTradesTable('forexTradesBody', forexData.closed_trades);
        }

        // Update Crypto Section
        function updateCryptoSection(cryptoData) {
            const cryptoStats = document.getElementById('cryptoStats');
            cryptoStats.innerHTML = `
                <div class="stat-box success">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value">${cryptoData.win_rate.toFixed(1)}%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Trades</div>
                    <div class="stat-value">${cryptoData.total_trades}</div>
                </div>
                <div class="stat-box ${cryptoData.profit_loss > 0 ? 'success' : 'danger'}">
                    <div class="stat-label">P&L</div>
                    <div class="stat-value">${cryptoData.profit_loss > 0 ? '+' : ''}$${cryptoData.profit_loss.toFixed(2)}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Status</div>
                    <div class="stat-value">${cryptoData.status === 'running' ? '🟢 Running' : '🔴 Stopped'}</div>
                </div>
            `;

            updateTradesTable('cryptoTradesBody', cryptoData.closed_trades);
        }

        // Update Trades Table
        function updateTradesTable(elementId, trades) {
            const tbody = document.getElementById(elementId);
            
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">No trades yet</td></tr>';
                return;
            }

            tbody.innerHTML = trades.slice(-10).reverse().map(trade => `
                <tr>
                    <td>${new Date(trade.timestamp).toLocaleTimeString()}</td>
                    <td><strong>${trade.symbol}</strong></td>
                    <td><span class="trade-badge ${trade.type.toLowerCase()}">${trade.type}</span></td>
                    <td>${trade.entry_price.toFixed(5)}</td>
                    <td>${trade.exit_price ? trade.exit_price.toFixed(5) : '-'}</td>
                    <td style="color: ${trade.pnl > 0 ? '#10b981' : '#ef4444'}; font-weight: bold;">
                        ${trade.pnl > 0 ? '+' : ''}$${trade.pnl.toFixed(2)}
                    </td>
                </tr>
            `).join('');
        }

        // Update Alerts
        async function updateAlerts() {
            try {
                const response = await fetch(`${API_BASE}/alerts?limit=10`);
                const data = await response.json();
                
                const container = document.getElementById('alertsContainer');
                
                if (data.alerts.length === 0) {
                    container.innerHTML = '<p style="color: #999; text-align: center;">No alerts yet</p>';
                    return;
                }

                container.innerHTML = data.alerts.reverse().map(alert => `
                    <div class="alert-item ${alert.type}">
                        <div class="alert-content">
                            <div class="alert-message">${alert.message}</div>
                            <div class="alert-time">${new Date(alert.timestamp).toLocaleTimeString()} • ${alert.source}</div>
                        </div>
                        <button class="alert-close" onclick="this.parentElement.remove()">×</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error updating alerts:', error);
            }
        }

        // Bot Control Functions
        async function startForexBot() {
            try {
                await fetch(`${API_BASE}/bot/forex/start`, { method: 'POST' });
                updateDashboard();
            } catch (error) {
                console.error('Error starting Forex bot:', error);
            }
        }

        async function stopForexBot() {
            try {
                await fetch(`${API_BASE}/bot/forex/stop`, { method: 'POST' });
                updateDashboard();
            } catch (error) {
                console.error('Error stopping Forex bot:', error);
            }
        }

        async function startCryptoBot() {
            try {
                await fetch(`${API_BASE}/bot/crypto/start`, { method: 'POST' });
                updateDashboard();
            } catch (error) {
                console.error('Error starting Crypto bot:', error);
            }
        }

        async function stopCryptoBot() {
            try {
                await fetch(`${API_BASE}/bot/crypto/stop`, { method: 'POST' });
                updateDashboard();
            } catch (error) {
                console.error('Error stopping Crypto bot:', error);
            }
        }

        // Widget Toggle
        function toggleWidget(widgetType) {
            const btn = event.target;
            btn.classList.toggle('active');
            
            const visible = btn.classList.contains('active');
            fetch(`${API_BASE}/widgets/${widgetType}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ visible })
            });
        }

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            clearInterval(updateInterval);
        });
    </script>
</body>
</html>
